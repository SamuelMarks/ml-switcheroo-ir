repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-typing
        name: AST Typing & Anti-Reflection Linter
        entry: python3 scripts/lint_typing.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy --strict src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: interrogate
        name: Interrogate Doc Coverage
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-docs
        name: Granular AST Docstring & Signature Check
        entry: python3 scripts/check_docs.py src scripts tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: pytest tests/ --cov=src/ml_switcheroo_ir --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-function-coverage
        name: Enforce 100% Function, Line & Branch Coverage
        entry: python3 scripts/check_function_coverage.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: verify-grounding
        name: Verify Grounding via ../ml-framework-snapshots
        entry: python3 scripts/verify_grounding.py --strict --snapshots-dir ../ml-framework-snapshots --ecosystem-snapshots-dir ../ml-ecosystem-snapshots
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: update-badges
        name: Make Coverage Shields
        entry: python3 scripts/update_badges.py
        language: system
        pass_filenames: false
        always_run: true

      - id: enforce-badges
        name: Enforce Coverage Shields
        entry: python3 scripts/update_badges.py --enforce
        language: system
        pass_filenames: false
        always_run: true

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
        always_run: true
