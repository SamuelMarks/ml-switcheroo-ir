exclude: '^third_party/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff-format
        name: ruff format (auto-fix)
      - id: ruff
        name: ruff lint (auto-fix)
        args: [ --fix ]
      - id: ruff-format
        name: ruff format (recheck)
        alias: ruff-format-check
        args: [ --check ]

  - repo: local
    hooks:
      - id: build
        name: Build package
        entry: python3 -m build
        language: system
        pass_filenames: false
        types_or: [python, toml]

      - id: update-shields
        name: Run tests and update coverage shields
        entry: python3 scripts/precommit_shields.py
        language: system
        pass_filenames: false
        types_or: [python, markdown]
