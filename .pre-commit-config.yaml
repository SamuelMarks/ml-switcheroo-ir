repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Doc Coverage
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: pytest tests/ --cov=src/ml_switcheroo_ir --cov=scripts --cov-branch --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: verify-grounding
        name: Verify Grounding
        entry: python3 scripts/verify_grounding.py
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Make Coverage Shields
        entry: python3 scripts/update_badges.py
        language: system
        pass_filenames: false

      - id: enforce-badges
        name: Enforce Coverage Shields
        entry: python3 scripts/update_badges.py --enforce
        language: system
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
