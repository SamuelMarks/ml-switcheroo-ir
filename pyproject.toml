[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml-switcheroo-ir"
description = "Intermediate Representation for Abstract ML Machine Compiler Ecosystem (Tier 1)"
authors = [
    { name = "Samuel Marks <807580+SamuelMarks@users.noreply.github.com>" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
ml-switcheroo-ir = "ml_switcheroo_ir.cli:main"

[project.urls]
Homepage = "https://github.com/SamuelMarks/ml-switcheroo-ir"

[tool.hatch.version]
path = "src/ml_switcheroo_ir/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["requirements-test.txt"]

[tool.ruff]
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D401", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_decorators = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = [
    "tabulate",
    "tabulate.*",
    "ml_ecosystem_snapshots",
    "ml_ecosystem_snapshots.*",
    "onnx",
    "onnx.*",
    "numpy",
    "numpy.*",
    "hypothesis",
    "hypothesis.*",
    "pytest",
    "_pytest.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
disable_error_code = ["import-untyped"]

[tool.interrogate]
fail-under = 100
ignore-init-module = false
ignore-init-method = false
ignore-nested-classes = false
ignore-private = false
ignore-semiprivate = false


