[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml-switcheroo-ir"
description = "Intermediate Representation for Abstract ML Machine Compiler Ecosystem (Tier 1)"
authors = [
    { name = "Samuel Marks <807580+SamuelMarks@users.noreply.github.com>" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
format = ["black"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff",
    "mypy",
    "interrogate",
    "build",
    "hypothesis",
    "jsonschema",
    "onnx",
    "griffe @ git+https://github.com/SamuelMarks/griffe.git@rest",
]

[project.scripts]
ml-switcheroo-ir = "ml_switcheroo_ir.cli:main"
ml_switcheroo_ir = "ml_switcheroo_ir.cli:main"

[project.urls]
Homepage = "https://github.com/SamuelMarks/ml-switcheroo-ir"

[tool.hatch.version]
path = "src/ml_switcheroo_ir/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_switcheroo_ir"]
artifacts = ["src/ml_switcheroo_ir/schema/catalogs/*.json"]

[tool.ruff]
target-version = "py39"
exclude = ["third_party"]
line-length = 120
lint.select = ["E", "F", "FA", "UP", "B", "I", "C901", "PLR09", "D"]
lint.ignore = ["B905", "D418"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "third_party"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
strict_equality = true
extra_checks = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "unimported-reveal",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "tabulate",
    "ml_ecosystem_snapshots",
    "ml_ecosystem_snapshots.*",
    "onnx",
    "onnx.*",
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
omit = [
    "tests/*",
    "docs/*",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = false
fail-under = 100
exclude = ["docs"]
ignore-regex = []
# possible values: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false


