name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Checkout ml-ecosystem-snapshots
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-ecosystem-snapshots
        ref: v0.0.6
        path: ml-ecosystem-snapshots
        persist-credentials: false

    - name: Link ../ml-framework-snapshots and ../ml-ecosystem-snapshots
      run: |
        mv ml-ecosystem-snapshots ../ml-ecosystem-snapshots
        ln -s ../ml-ecosystem-snapshots ../ml-framework-snapshots

    - name: Populate Ground-Truth Snapshots
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots
        mkdir -p ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/frameworks
        gh release download v0.0.6 -p "*.json" -R SamuelMarks/ml-ecosystem-snapshots --dir ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots --clobber || gh release download -p "*.json" -R SamuelMarks/ml-ecosystem-snapshots --dir ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots --clobber
        cp ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots/*_exhaustive.json ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/frameworks/ 2>/dev/null || true
        cp ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots/concept_map.json ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/ 2>/dev/null || true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        grep -v '^ml-switcheroo-ir' ../ml-ecosystem-snapshots/requirements.txt | pip install -r /dev/stdin
        pip install --no-deps -e ../ml-ecosystem-snapshots
        pip install .[test]

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: AST Typing & Anti-Reflection Linter
      run: python scripts/lint_typing.py

    - name: Type Checking (Mypy)
      run: mypy --strict src tests scripts

    - name: Check Doc Coverage (Interrogate)
      run: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests

    - name: Granular AST Docstring & Signature Check
      run: python scripts/check_docs.py src scripts tests

    - name: Test, Function, Line & Branch Coverage
      run: |
        pytest tests/ --cov=src/ml_switcheroo_ir --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        python scripts/check_function_coverage.py

    - name: Verify Grounding via ../ml-framework-snapshots
      run: python scripts/verify_grounding.py --strict --snapshots-dir ../ml-framework-snapshots --ecosystem-snapshots-dir ../ml-ecosystem-snapshots

    - name: Update & Enforce Badges
      if: matrix.python-version == '3.12'
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi
        python scripts/update_badges.py --enforce

    - name: Build & Verify Wheel Installation
      run: |
        python -m build
        pip install --force-reinstall dist/*.whl
        python -c "import ml_switcheroo_ir; print('ml-switcheroo-ir version:', ml_switcheroo_ir.__version__)"
