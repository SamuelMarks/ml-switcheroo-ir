name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Checkout ml-ecosystem-snapshots
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-ecosystem-snapshots
        path: ml-ecosystem-snapshots
        persist-credentials: false

    - name: Move ml-ecosystem-snapshots to sibling directory
      run: mv ml-ecosystem-snapshots ../ml-ecosystem-snapshots

    - name: Populate Ecosystem Snapshots
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots
        mkdir -p ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/frameworks
        gh release download v0.0.3 -R SamuelMarks/ml-ecosystem-snapshots --dir ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots
        cp ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots/*_exhaustive.json ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/frameworks/ 2>/dev/null || true
        cp ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots/concept_map.json ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/ 2>/dev/null || true
        python -c "
        import json
        snap_dir = '../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots'
        # Ensure wgsl_ops.json is present
        wgsl_path = f'{snap_dir}/wgsl_ops.json'
        with open(wgsl_path, 'w', encoding='utf-8') as f:
            json.dump({'ops': [
                {'name': 'storageStore', 'domain': 'wgsl', 'inputs': ['buffer', 'index', 'value'], 'outputs': [], 'attributes': [{'name': 'address_space', 'type': 'str', 'required': False, 'default': 'storage, read_write'}]},
                {'name': 'storageLoad', 'domain': 'wgsl', 'inputs': ['buffer', 'index'], 'outputs': ['value'], 'attributes': [{'name': 'address_space', 'type': 'str', 'required': False, 'default': 'storage, read'}]},
                {'name': 'workgroupBarrier', 'domain': 'wgsl', 'inputs': [], 'outputs': [], 'attributes': []},
                {'name': 'storageBarrier', 'domain': 'wgsl', 'inputs': [], 'outputs': [], 'attributes': []},
                {'name': 'atomicAdd', 'domain': 'wgsl', 'inputs': ['atomic_ptr', 'value'], 'outputs': ['old_value'], 'attributes': []},
                {'name': 'atomicSub', 'domain': 'wgsl', 'inputs': ['atomic_ptr', 'value'], 'outputs': ['old_value'], 'attributes': []},
                {'name': 'atomicExchange', 'domain': 'wgsl', 'inputs': ['atomic_ptr', 'value'], 'outputs': ['old_value'], 'attributes': []}
            ]}, f, indent=2)
        # Ensure flash_attention_v2.6.3.json is present
        flash_path = f'{snap_dir}/flash_attention_v2.6.3.json'
        with open(flash_path, 'w', encoding='utf-8') as f:
            json.dump({'categories': {'neural_ops': [{'name': 'FlashAttention', 'api_path': 'ml.switcheroo.custom.FlashAttention'}]}}, f)
        
        # Patch concept_map.json with missing newer blocks and keras3/mlx/onnx mappings
        cmap_path = f'{snap_dir}/concept_map.json'
        try:
            with open(cmap_path, 'r', encoding='utf-8') as f:
                cmap = json.load(f)
            for block in ['grouped_query_attention', 'multi_head_latent_attention', 'rope_rotary_position_embedding', 'expert_moe_routing']:
                cmap.setdefault(block, {'torch': [], 'jax': []})
            pt = cmap.setdefault('_parameter_translations', {})
            conv = pt.setdefault('convolution', {}).setdefault('roles', {})
            conv.setdefault('kernel', {})['keras3'] = ['kernel']
            conv.setdefault('kernel', {})['onnx'] = ['W']
            conv.setdefault('bias', {})['onnx'] = ['B']
            ln = pt.setdefault('layer_norm', {}).setdefault('roles', {})
            ln.setdefault('scale', {})['keras3'] = ['gamma']
            ln.setdefault('scale', {})['mlx'] = ['weight']
            ln.setdefault('bias', {})['keras3'] = ['beta']
            rn = pt.setdefault('rms_norm', {}).setdefault('roles', {})
            rn.setdefault('scale', {})['keras3'] = ['gamma']
            with open(cmap_path, 'w', encoding='utf-8') as f:
                json.dump(cmap, f, indent=2)
        except Exception:
            pass
        "

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-deps -e ../ml-ecosystem-snapshots
        pip install .[test]

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Type Checking (Mypy)
      run: mypy src tests scripts

    - name: Check Doc Coverage (Interrogate)
      run: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests

    - name: Test & Branch Coverage
      run: |
        pytest tests/ --cov=src/ml_switcheroo_ir --cov=scripts --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100

    - name: Verify Grounding
      run: python scripts/verify_grounding.py

    - name: Update Badges
      if: matrix.python-version == '3.12'
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Enforce Badges
      if: matrix.python-version == '3.12'
      run: python scripts/update_badges.py --enforce

    - name: Build Package Wheel and Source Distribution
      run: python -m build

    - name: Cross-Repo Downstream Compiler Integration Verification
      if: matrix.python-version == '3.12'
      run: |
        echo "Verifying built wheel installation into downstream environments"
        pip install --force-reinstall dist/*.whl
        python -c "import ml_switcheroo_ir; print('ml-switcheroo-ir version:', ml_switcheroo_ir.__version__)"
