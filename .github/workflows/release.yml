name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Checkout ml-ecosystem-snapshots
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-ecosystem-snapshots
        ref: v0.0.6
        path: ml-ecosystem-snapshots
        persist-credentials: false

    - name: Link ../ml-framework-snapshots and Populate Snapshots
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mv ml-ecosystem-snapshots ../ml-ecosystem-snapshots
        ln -s ../ml-ecosystem-snapshots ../ml-framework-snapshots
        mkdir -p ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots
        gh release download v0.0.6 -p "*.json" -R SamuelMarks/ml-ecosystem-snapshots --dir ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots --clobber || gh release download -p "*.json" -R SamuelMarks/ml-ecosystem-snapshots --dir ../ml-ecosystem-snapshots/src/ml_ecosystem_snapshots/snapshots --clobber

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        grep -v '^ml-switcheroo-ir' ../ml-ecosystem-snapshots/requirements.txt | pip install -r /dev/stdin
        pip install --no-deps -e ../ml-ecosystem-snapshots
        pip install .[test]

    - name: Verify Lint, Types, Docs, Grounding & 100% Coverage
      run: |
        ruff format --check .
        ruff check .
        python scripts/lint_typing.py
        mypy --strict src tests scripts
        interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        python scripts/check_docs.py src scripts tests
        pytest tests/ --cov=src/ml_switcheroo_ir --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        python scripts/check_function_coverage.py
        python scripts/verify_grounding.py --strict --snapshots-dir ../ml-framework-snapshots --ecosystem-snapshots-dir ../ml-ecosystem-snapshots
        python scripts/update_badges.py --enforce

    - name: Build Package
      run: python -m build

    - name: Release to GitHub Releases
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
